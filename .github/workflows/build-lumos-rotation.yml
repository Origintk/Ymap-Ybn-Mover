name: Build Ymap Ybn Mover - Lumos Rotation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Patch mover and add rotation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $path = "MainForm.cs"
          $src = Get-Content $path -Raw

          $dupPattern = '(?s)(\s*if \(ymap\.AllEntities != null\)\s*\{\s*foreach \(YmapEntityDef yEnts in ymap\.AllEntities\)\s*yEnts\.SetPosition\(yEnts\.Position \+ moveVector\);\s*\})\s*(if \(ymap\.AllEntities != null\)\s*\{\s*foreach \(YmapEntityDef yEnts in ymap\.AllEntities\)\s*yEnts\.SetPosition\(yEnts\.Position \+ moveVector\);\s*\})'
          $patched = [regex]::Replace($src, $dupPattern, '$1', 1)
          if ($patched -ne $src) {
              $src = $patched
              Write-Host "OK: duplicate YMAP movement removed."
          } else {
              Write-Warning "Duplicate YMAP block not found; source may already be fixed."
          }

          if ($src -notmatch 'InitializeLumosRotationControls\(\);') {
              $src = $src.Replace('InitializeComponent();', "InitializeComponent();`r`n            InitializeLumosRotationControls();")
          }

          $moveLine = 'Vector3 moveVector = new((float)xMoveNumeric.Value, (float)yMoveNumeric.Value, (float)zMoveNumeric.Value);'
          if ($src -notmatch 'float lumosAngleDeg =') {
              if (-not $src.Contains($moveLine)) { throw "moveVector line not found." }
              $extra = $moveLine + "`r`n            float lumosAngleDeg = lumosRotationEnabled.Checked ? (float)lumosRotationAngle.Value : 0.0f;" +
                       "`r`n            Vector3 lumosPivot = new((float)lumosPivotX.Value, (float)lumosPivotY.Value, 0.0f);" +
                       "`r`n            bool lumosRotateYbn = lumosRotateYbnCheck.Checked;"
              $src = $src.Replace($moveLine, $extra)
          }

          $src = $src.Replace(
              'await ProcessYmapFileAsync(filename, moveVector, item);',
              'await ProcessYmapFileAsync(filename, moveVector, lumosPivot, lumosAngleDeg, item);'
          )
          $src = $src.Replace(
              'await ProcessYbnFileAsync(filename, moveVector, item);',
              'await ProcessYbnFileAsync(filename, moveVector, lumosPivot, lumosAngleDeg, lumosRotateYbn, item);'
          )

          $src = $src.Replace(
              'private async Task ProcessYmapFileAsync(string filename, Vector3 moveVector, ListViewItem item)',
              'private async Task ProcessYmapFileAsync(string filename, Vector3 moveVector, Vector3 lumosPivot, float lumosAngleDeg, ListViewItem item)'
          )
          $src = $src.Replace(
              'private async Task ProcessYbnFileAsync(string filename, Vector3 moveVector, ListViewItem item)',
              'private async Task ProcessYbnFileAsync(string filename, Vector3 moveVector, Vector3 lumosPivot, float lumosAngleDeg, bool lumosRotateYbn, ListViewItem item)'
          )

          if ($src -notmatch 'ApplyLumosYmapRotation\(ymap') {
              $src = $src.Replace(
                  'ymap.Load(oldData);',
                  "ymap.Load(oldData);`r`n                if (Math.Abs(lumosAngleDeg) > 0.0001f)`r`n                    ApplyLumosYmapRotation(ymap, lumosPivot, lumosAngleDeg);"
              )
          }

          if ($src -notmatch 'ApplyLumosYbnRotation\(ybn') {
              $src = $src.Replace(
                  'ybn.Load(oldData);',
                  "ybn.Load(oldData);`r`n                if (lumosRotateYbn && Math.Abs(lumosAngleDeg) > 0.0001f)`r`n                    ApplyLumosYbnRotation(ybn, lumosPivot, lumosAngleDeg);"
              )
          }

          Set-Content -Path $path -Value $src -Encoding UTF8

          $rotationSource = ""
          [IO.File]::WriteAllBytes("LumosRotation.cs", [Convert]::FromBase64String($rotationSource))
          Write-Host "OK: Lumos rotation engine added."

      - name: Download CodeWalker runtime dependency
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/92-Smallo/Ymap-Ybn-Mover/releases/download/1.0.6/Ymap.Ybn.Mover.v1.0.6.zip"
          Invoke-WebRequest -Uri $url -OutFile "upstream.zip"
          Expand-Archive -Path "upstream.zip" -DestinationPath "upstream" -Force

          $cw = Get-ChildItem "upstream" -Recurse -Filter "CodeWalker.Core.dll" | Select-Object -First 1
          if (-not $cw) { throw "CodeWalker.Core.dll not found." }

          New-Item -ItemType Directory -Path "lib" -Force | Out-Null
          Copy-Item $cw.FullName "lib\CodeWalker.Core.dll" -Force

          $projPath = "Ymap Ybn Mover.csproj"
          $proj = Get-Content $projPath -Raw
          $oldProj = $proj
          $proj = [regex]::Replace(
              $proj,
              '<HintPath>.*?CodeWalker\.Core\.dll</HintPath>',
              '<HintPath>lib\CodeWalker.Core.dll</HintPath>'
          )
          if ($proj -eq $oldProj) { throw "CodeWalker HintPath was not replaced." }
          Set-Content -Path $projPath -Value $proj -Encoding UTF8

      - name: Restore
        shell: pwsh
        run: dotnet restore ".\Ymap Ybn Mover.csproj"

      - name: Publish Windows x64
        shell: pwsh
        run: |
          dotnet publish ".\Ymap Ybn Mover.csproj" `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -o ".\publish"

      - name: Create final package
        shell: pwsh
        run: |
          $cw = Get-ChildItem "upstream" -Recurse -Filter "CodeWalker.Core.dll" | Select-Object -First 1
          $originalFolder = $cw.Directory.FullName

          New-Item -ItemType Directory -Path "package" -Force | Out-Null
          Copy-Item "$originalFolder\*" ".\package\" -Recurse -Force
          Copy-Item ".\publish\*" ".\package\" -Recurse -Force

          "Lumos Rotation build. Always back up maps. YBN rotation is experimental." | Set-Content ".\package\LUMOS_ROTATION.txt"

      - name: Upload compiled program
        uses: actions/upload-artifact@v4
        with:
          name: Ymap-Ybn-Mover-Lumos-Rotation
          path: package
          retention-days: 7
